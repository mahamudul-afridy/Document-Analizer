# DocuMind AI: the only deployment file. Same file on a local PC and on a VPS.
#   Local:  docker compose up -d --build   ->  http://localhost
#   VPS:    set SITE_ADDRESS=your.domain in .env, same command  ->  https://your.domain (auto HTTPS)

x-app: &app
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  volumes: [storage:/data/storage]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --concurrency=${WORKER_CONCURRENCY:-2} --loglevel=info

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: [caddy_data:/data]
    depends_on: [api]
    restart: unless-stopped

volumes: { pgdata: {}, redisdata: {}, storage: {}, caddy_data: {} }
